<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel Column Mapper</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#171d2b;--panel:#1d2536;--line:#344057;--muted:#9aa8bf;--text:#eef3fb;--blue:#2f6bfa;--green:#09a77e;--red:#ff687b}*{box-sizing:border-box}body{margin:0;background:#131927;color:var(--text);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{border:1px solid var(--line);color:var(--text);background:#252f43;border-radius:9px;padding:10px 15px;cursor:pointer}button:hover{filter:brightness(1.13)}button.primary{background:var(--blue);border-color:#5b89ff;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1280px;margin:24px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{color:#68a4ff;font-size:24px}.brand h1{font-size:22px;margin:0}.sub{color:var(--muted);margin:3px 0 0}.wizard,.card{background:var(--bg);border:1px solid var(--line);border-radius:14px}.wizard{padding:18px 24px;margin-bottom:18px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{text-align:center;color:var(--muted);font-size:12px;position:relative}.step:before{content:"";display:block;width:32px;height:32px;border:2px solid var(--line);background:var(--panel);border-radius:50%;margin:0 auto 5px;position:relative;z-index:1}.step:after{content:"";position:absolute;top:15px;left:calc(50% + 22px);width:calc(100% - 44px);height:2px;background:var(--line)}.step:last-child:after{display:none}.step.active,.step.done{color:#65a9ff}.step.active:before{background:var(--blue);border-color:#5b89ff}.step.done:before{background:var(--green);border-color:var(--green)}.card{padding:22px;margin-bottom:16px}.card h2{font-size:18px;margin:0 0 6px}.hint{color:var(--muted);margin:0 0 18px}.drop{border:1px dashed #536480;background:#1c2537;border-radius:12px;padding:25px;text-align:center;color:var(--muted)}.drop strong{display:block;color:var(--text);font-size:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.fileinput{display:none}.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 9px;border:1px solid var(--line);border-radius:30px;color:#b9c7dc;font-size:12px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:14px}table{border-collapse:collapse;width:100%;min-width:680px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #303a4f;vertical-align:top}th{background:#222b3d;font-weight:650;position:sticky;top:0}tr:last-child td{border-bottom:0}.scroll{max-height:420px;overflow:auto}.mapping select,.mapping input{width:100%;min-width:210px;background:#232d41;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:8px}.mapping th:last-child,.mapping td:last-child{width:260px}.tag{font-size:11px;color:#91a4c0}.required{color:#ff8291}.notice{padding:11px 13px;border-radius:9px;margin:10px 0;background:#342b25;color:#ffd090}.notice.error{background:#38242d;color:#ff9ba8}.notice.success{background:#16372f;color:#89e2c5}.nav{display:flex;justify-content:space-between;gap:10px;padding:14px 2px}.nav .right{display:flex;gap:9px}.hidden{display:none!important}.selector{padding:8px;background:#232d41;color:var(--text);border:1px solid var(--line);border-radius:8px}.small{font-size:12px;color:var(--muted)}.check{display:flex;gap:8px;align-items:center}.warning{color:#ffce81}.good{color:#89e2c5}.filegrid{display:grid;gap:8px}.filecard{border:1px solid var(--line);background:#1d2536;border-radius:10px;padding:12px}.badge{border-radius:5px;padding:2px 7px;background:#293650;font-size:11px}.footer{color:#71819a;text-align:center;padding:16px;font-size:12px}@media(max-width:700px){.app{padding:0 10px;margin:10px auto}.card{padding:15px}.wizard{padding:15px 10px}.steps{gap:1px}.step{font-size:10px}.step:after{width:calc(100% - 30px);left:calc(50% + 16px)}.top{align-items:flex-start}.brand h1{font-size:19px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><span class="logo">▤</span><div><h1>Excel Column Mapper</h1><p class="sub">Standardize and consolidate files into your predefined master format.</p></div></div><button id="resetBtn">Reset</button></header>
<div class="wizard"><div class="steps" id="steps"></div></div><main id="main"></main><div class="nav"><button id="backBtn">‹ &nbsp;Back</button><div class="right"><button id="nextBtn" class="primary">Next &nbsp;›</button></div></div><div class="footer">Files are processed in your browser. Your data is not uploaded to a server.</div></div>
<input id="templateInput" class="fileinput" type="file" accept=".xlsx,.xls"><input id="sourceInput" class="fileinput" type="file" accept=".xlsx,.xls,.csv" multiple>
<script>
(()=>{
const steps=['Template & Upload','Preview Sources','Map Columns','Options','Preview & Export'];let step=0,template=null,datasets=[],maxBytes=14*1024*1024,maxRows=5000,master=[];
const aliases={'Company':['company','company name','organisation','organization','account','business','employer'],'Contact Person':['contact person','name','full name','contact name','person','lead name'],'Designation':['job title','title','designation','position','role'],'Email':['email','business email','contact email','e-mail'],'Contact Number':['phone','phone number','mobile','telephone','contact number'],'LinkedIn':['linkedin','linkedin url','profile url'],'Website':['website','company website','domain','url'],'Company Registration No.':['registration number','company number','registration no','reg number'],'City':['city','town'],'Country':['country'],'Company LinkedIn':['company linkedin','company linkedin url'],'Company *':['company','company name','organisation','organization','account','business'],'Contact Person *':['contact person','full name','contact name','person']};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderSteps(){ $('#steps').innerHTML=steps.map((x,i)=>`<div class="step ${i===step?'active':i<step?'done':''}">${x}</div>`).join('');$('#backBtn').disabled=step===0;$('#nextBtn').textContent=step===4?'Export files':'Next  ›';}
function cellRows(ws){return XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});}
function headersOf(rows){let i=rows.findIndex(r=>r.some(x=>String(x??'').trim()!==''));if(i<0)return {headers:[],records:[],headerRow:0};return {headers:rows[i].map(x=>String(x??'')),records:rows.slice(i+1).filter(r=>r.some(v=>v!==''&&v!=null)),headerRow:i};}
function dsFrom(name,sheet,rows){let p=headersOf(rows);return {id:crypto.randomUUID(),file:name,sheet,headers:p.headers,rows:p.records.slice(0,maxRows),originalCount:p.records.length,selected:true,map:{},excluded:false};}
function normalize(s){return String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/\*$/,'');}
function suggest(h){let n=normalize(h),fields=template?.fields||[];let exact=fields.find(f=>normalize(f.name)===n);if(exact)return {field:exact.name,confidence:'High'};for(let f of fields){let al=aliases[f.name]||[];if(al.some(a=>normalize(a)===n))return {field:f.name,confidence:'High'};}let best=null,score=0;for(let f of fields){let fn=normalize(f.name.replace('*',''));let sc=n&&fn&&(n.includes(fn)||fn.includes(n))?Math.min(n.length,fn.length)/Math.max(n.length,fn.length):0;if(sc>score){score=sc;best=f.name;}}return score>=.65?{field:best,confidence:'Review'}:{field:'',confidence:'Unmapped'};}
async function readTemplate(file){if(file.size>maxBytes)throw Error('Template exceeds 14 MB.');let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});let name=wb.SheetNames.find(n=>n.trim().toLowerCase()==='template');if(!name)throw Error('The workbook needs a worksheet named “Template”.');let rows=cellRows(wb.Sheets[name]),p=headersOf(rows);if(!p.headers.length)throw Error('The Template worksheet has no field names.');template={file:file.name,fields:p.headers.map(name=>({name,required:name.trim().endsWith('*')}))};return wb;}
async function readSource(file){if(file.size>maxBytes)throw Error(file.name+' exceeds 14 MB.');if(/\.csv$/i.test(file.name)){let wb=XLSX.read(await file.arrayBuffer(),{type:'array',raw:true});let ds=dsFrom(file.name,'CSV',cellRows(wb.Sheets[wb.SheetNames[0]]));if(ds.originalCount>maxRows)throw Error(file.name+' has '+ds.originalCount+' data rows; maximum is 5,000.');datasets.push(ds);return;}let wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});for(const sn of wb.SheetNames){const d=dsFrom(file.name,sn,cellRows(wb.Sheets[sn]));if(d.originalCount>maxRows)throw Error(file.name+' / '+sn+' has '+d.originalCount+' data rows; maximum is 5,000.');datasets.push(d);}}
function render(){renderSteps();let html='';if(step===0){html=`<section class="card"><h2>Load your master template</h2><p class="hint">Choose the reference workbook. We read every field name and required marker from its <b>Template</b> worksheet.</p><div class="row"><button class="primary" onclick="document.querySelector('#templateInput').click()">${template?'Replace template':'Choose template workbook'}</button>${template?`<span class="pill">${esc(template.file)}</span><span class="pill">${template.fields.length} fields</span>`:''}</div>${template?`<div class="stats">${template.fields.filter(f=>f.required).map(f=>`<span class="pill"><span class="required">*</span>${esc(f.name)}</span>`).join('')}</div>`:''}</section><section class="card"><h2>Add source files</h2><p class="hint">Upload multiple workbooks or CSV files. Excel worksheets are processed independently and can be excluded before mapping.</p><div class="drop" id="drop"><strong>Drag and drop your files here or click to browse.</strong><span>CSV, XLS, XLSX · Max 14 MB per file · Max 5,000 rows per sheet</span><br><button style="margin-top:14px" onclick="document.querySelector('#sourceInput').click()">Browse files</button></div><div class="row" style="margin-top:12px"><button id="addMore">Add more files</button></div>${datasets.length?`<div class="filegrid">${datasets.map((d,i)=>`<div class="filecard row between"><div><b>${esc(d.file)}</b> <span class="badge">${esc(d.sheet)}</span><div class="small">${d.originalCount} records · ${d.headers.length} columns</div></div><label class="check"><input type="checkbox" ${d.selected?'checked':''} data-select="${i}"> Include</label><button data-remove="${i}">Remove</button></div>`).join('')}</div>`:''}</section>`;}
if(step===1){let active=datasets.filter(d=>d.selected);html=`<section class="card"><h2>Preview original source data</h2><p class="hint">Original headers and values are shown here before any mapping or standardization.</p><div class="row"><label for="dsPick">Source worksheet</label><select id="dsPick" class="selector">${active.map(d=>`<option value="${d.id}">${esc(d.file)} · ${esc(d.sheet)}</option>`).join('')}</select></div><div id="sourcePreview"></div></section>`;}
if(step===2){let active=datasets.filter(d=>d.selected);html=`<section class="card"><h2>Map source columns to template fields</h2><p class="hint">Review each source separately. Several source columns can target one field; the first non-empty mapped value is used, and differing values are flagged.</p><div class="row"><label>Source worksheet</label><select id="mapPick" class="selector">${active.map(d=>`<option value="${d.id}">${esc(d.file)} · ${esc(d.sheet)}</option>`).join('')}</select></div><div id="mappingTable"></div></section>`;}
if(step===3){html=`<section class="card"><h2>Consolidation options</h2><p class="hint">Records append vertically in the template's field order. Blank cells and duplicate rows are retained.</p><div class="stats"><span class="pill">${datasets.filter(d=>d.selected).length} selected worksheets</span><span class="pill">${datasets.filter(d=>d.selected).reduce((a,d)=>a+d.originalCount,0)} source records</span><span class="pill">No automatic deduplication</span></div><label class="check"><input id="dupeFlag" type="checkbox"> Identify exact duplicate rows in preview</label><p class="small">Duplicate detection only adds a preview indicator; it never removes records.</p><div id="optionWarnings"></div></section>`;}
if(step===4){let res=buildOutput();html=`<section class="card"><div class="row between"><div><h2>Consolidated preview</h2><p class="hint">This is the standardized output that will be exported.</p></div><div class="row"><span class="pill">${res.rows.length} records</span><span class="pill">${template.fields.length+2} columns</span></div></div><div class="stats"><span class="pill">${datasets.filter(d=>d.selected).length} source worksheets</span><span class="pill">${res.mapped} mapped columns</span><span class="pill">${res.unmapped} unmapped source columns</span><span class="pill ${res.missing? 'warning':''}">${res.missing} required fields not mapped</span></div>${res.missing?`<div class="notice error">Required field mappings are missing. Records remain included and blank required values will be reported in the summary.</div>`:''}${res.conflicts?`<div class="notice">${res.conflicts} conflicting values detected where multiple source columns target the same field.</div>`:''}${res.missingRows?`<div class="notice">${res.missingRows} records have at least one missing required value.</div>`:''}<div class="tablewrap scroll"><table><thead><tr>${res.headers.map(h=>`<th>${esc(h)}</th>`).join('')}${$('#dupeFlag')?.checked?'<th>Duplicate</th>':''}</tr></thead><tbody>${res.rows.slice(0,10).map(r=>`<tr>${res.headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}${$('#dupeFlag')?.checked?`<td>${r.__duplicate?'Yes':''}</td>`:''}</tr>`).join('')}</tbody></table></div><p class="small">Showing first ${Math.min(10,res.rows.length)} of ${res.rows.length} records. Mandatory value issues do not remove records.</p></section><section class="card"><h2>Download your files</h2><p class="hint">Export the master file in Excel and CSV, plus a separate processing summary and mapping configuration.</p><div class="row"><button class="primary" id="exportAll">Download all outputs</button><button id="exportXlsx">Excel master</button><button id="exportCsv">CSV master</button><button id="exportSummary">Processing summary</button><button id="exportMap">Mapping configuration</button></div></section>`;}
$('#main').innerHTML=html;bindStep();}
function bindStep(){if(step===0){$('#addMore')?.addEventListener('click',()=>$('#sourceInput').click());document.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>{datasets[+el.dataset.select].selected=el.checked;});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{datasets.splice(+el.dataset.remove,1);render();});let drop=$('#drop');drop?.addEventListener('click',e=>{if(e.target===drop||e.target.tagName==='STRONG'||e.target.tagName==='SPAN')$('#sourceInput').click();});drop?.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='#68a4ff'});drop?.addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});}
if(step===1){$('#dsPick')?.addEventListener('change',renderSourcePreview);renderSourcePreview();}if(step===2){$('#mapPick')?.addEventListener('change',renderMapping);renderMapping();}if(step===4){$('#exportXlsx').onclick=()=>exportMaster('xlsx');$('#exportCsv').onclick=()=>exportMaster('csv');$('#exportSummary').onclick=exportSummary;$('#exportMap').onclick=exportMap;$('#exportAll').onclick=()=>{exportMaster('xlsx');setTimeout(()=>exportMaster('csv'),300);setTimeout(exportSummary,600);};}}
function renderSourcePreview(){let id=$('#dsPick')?.value,d=datasets.find(x=>x.id===id);if(!d)return;$('#sourcePreview').innerHTML=`<div class="stats"><span class="pill">${d.originalCount} records</span><span class="pill">${d.headers.length} columns</span></div><div class="tablewrap scroll"><table><thead><tr>${d.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${d.rows.slice(0,10).map(r=>`<tr>${d.headers.map((_,i)=>`<td>${esc(r[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function renderMapping(){let d=datasets.find(x=>x.id===$('#mapPick')?.value);if(!d)return;d.map=d.map||{};for(let h of d.headers)if(!(h in d.map)){let s=suggest(h);d.map[h]=s.field;}$('#mappingTable').innerHTML=`<div class="tablewrap scroll"><table class="mapping"><thead><tr><th>Your column</th><th>Maps to</th><th>Suggestion confidence</th></tr></thead><tbody>${d.headers.map(h=>{let s=suggest(h);return `<tr><td><b>${esc(h)}</b></td><td><select data-header="${esc(h)}"><option value="">— Skip this column —</option>${template.fields.map(f=>`<option value="${esc(f.name)}" ${d.map[h]===f.name?'selected':''}>${esc(f.name)}${f.required?' *':''}</option>`).join('')}</select></td><td><span class="tag">${s.field?`${esc(s.confidence)} suggestion`: 'No suggestion'}</span></td></tr>`}).join('')}</tbody></table></div>`;document.querySelectorAll('[data-header]').forEach(el=>el.onchange=()=>{d.map[el.dataset.header]=el.value;});}
function buildOutput(){let headers=[...template.fields.map(f=>f.name),'Source File Name','Source Sheet Name'],out=[],mapped=0,unmapped=0,conflicts=0,missingRows=0;let required=template.fields.filter(f=>f.required).map(f=>f.name);for(let d of datasets.filter(x=>x.selected)){for(let h of d.headers){if(d.map?.[h])mapped++;else unmapped++;}for(let row of d.rows){let o={};for(let h of headers)o[h]='';for(let fi=0;fi<template.fields.length;fi++){let target=template.fields[fi].name;let src=d.headers.filter(h=>d.map?.[h]===target);let vals=src.map(h=>row[d.headers.indexOf(h)]).filter(v=>v!==''&&v!=null);if(vals.length){o[target]=vals[0];if(vals.some(v=>String(v)!==String(vals[0])))conflicts++;}}o['Source File Name']=d.file;o['Source Sheet Name']=d.sheet;if(required.some(h=>o[h]===''||o[h]==null))missingRows++;out.push(o);}}let missing=template.fields.filter(f=>f.required&&!datasets.filter(d=>d.selected).some(d=>Object.values(d.map||{}).includes(f.name))).length;let seen=new Set();for(let r of out){let key=headers.slice(0,-2).map(h=>String(r[h]??'')).join('\u001f');r.__duplicate=seen.has(key);seen.add(key);}return {headers,rows:out,mapped,unmapped,conflicts,missing,missingRows};}
function exportMaster(type){let r=buildOutput(),ws=XLSX.utils.json_to_sheet(r.rows.map(x=>Object.fromEntries(r.headers.map(h=>[h,x[h]]))),{header:r.headers});let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Standardized Master');if(type==='csv'){let csv=XLSX.utils.sheet_to_csv(ws);download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'Standardized_Master.csv');}else XLSX.writeFile(wb,'Standardized_Master.xlsx',{cellStyles:true});}
function exportSummary(){let r=buildOutput(),rows=[['Source File Name','Source Sheet Name','Original Row Count','Original Column Count','Records Processed','Unmapped Source Columns','Missing Required Values','Conflicting Values','Status']];for(let d of datasets.filter(x=>x.selected)){let unm=d.headers.filter(h=>!d.map?.[h]);let miss=0,conf=0;for(let row of d.rows){for(let f of template.fields.filter(x=>x.required)){let src=d.headers.filter(h=>d.map?.[h]===f.name),v=src.map(h=>row[d.headers.indexOf(h)]).find(x=>x!==''&&x!=null);if(v==null)miss++;}for(let f of template.fields){let vals=d.headers.filter(h=>d.map?.[h]===f.name).map(h=>row[d.headers.indexOf(h)]).filter(x=>x!==''&&x!=null);if(vals.some(x=>String(x)!==String(vals[0])))conf++;}}rows.push([d.file,d.sheet,d.originalCount,d.headers.length,d.rows.length,unm.join(', '),miss,conf,'Processed']);}rows.push(['TOTAL','','', '',r.rows.length,'',r.missingRows,r.conflicts,'Complete']);let mapRows=[['Source File Name','Source Sheet Name','Source Column','Destination Field','Confidence']];for(let d of datasets.filter(x=>x.selected))for(let h of d.headers){let s=suggest(h);mapRows.push([d.file,d.sheet,h,d.map?.[h]||'Skipped',s.confidence]);}let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Processing Summary');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(mapRows),'Mapping Details');XLSX.writeFile(wb,'Processing_Summary.xlsx');}
function exportMap(){let data={template:template?.file,createdAt:new Date().toISOString(),mappings:datasets.filter(x=>x.selected).map(d=>({file:d.file,sheet:d.sheet,mappings:d.map}))};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'Mapping_Configuration.json');}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
async function addFiles(files){for(let f of files){try{let n=datasets.length;if(/\.csv$/i.test(f.name))await readSource(f);else await readSource(f);if(datasets.length===n)throw Error('No worksheets found.');}catch(e){alert(e.message);}}render();}
$('#templateInput').onchange=async e=>{try{await readTemplate(e.target.files[0]);render();}catch(err){alert(err.message)}};$('#sourceInput').onchange=e=>addFiles(e.target.files);$('#backBtn').onclick=()=>{if(step>0){step--;render();}};$('#nextBtn').onclick=()=>{if(step===0&&!template)return alert('Load the template workbook first.');if(step===0&&!datasets.some(d=>d.selected))return alert('Add at least one source worksheet or CSV file.');if(step===2){let bad=template.fields.filter(f=>f.required&&!datasets.filter(d=>d.selected).some(x=>Object.values(x.map||{}).includes(f.name)));if(bad.length&&!confirm('Required fields not mapped: '+bad.map(x=>x.name).join(', ')+'. Continue and report blank values?'))return;}if(step<4){step++;render();}else exportMaster('xlsx');};$('#resetBtn').onclick=()=>{if(confirm('Clear the template and all uploaded files?')){template=null;datasets=[];step=0;$('#templateInput').value='';$('#sourceInput').value='';render();}};render();
})();
</script></body></html>
